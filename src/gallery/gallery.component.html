<section class="bg-black px-6 py-12">
  <h2 class="mb-10 text-center text-2xl font-light uppercase tracking-[0.25em] text-slate-300 drop-shadow-[0_0_8px_rgba(186,214,255,0.35)]">Galeria</h2>

  <div class="mx-auto grid max-w-6xl grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    @for (imatge of imatges; track imatge.nom; let i = $index) {
      <figure class="galeria-item overflow-hidden rounded-lg border border-slate-700/60 bg-zinc-950 shadow-lg shadow-black/60">
        <!--
          srcset: les 3 versions de la imatge (400, 800 i 1200 px d'amplada)
          sizes:  l'amplada que ocuparà a la pantalla (1, 2 o 3 columnes)
          width/height: reserven l'espai abans de carregar (evita salts de disseny)
          loading: les 3 primeres (visibles a l'inici) eager, la resta lazy
        -->
        <img
          src="/imatges/{{ imatge.nom }}-800.webp"
          srcset="/imatges/{{ imatge.nom }}-400.webp 400w,
                  /imatges/{{ imatge.nom }}-800.webp 800w,
                  /imatges/{{ imatge.nom }}-1200.webp 1200w"
          sizes="(max-width: 640px) 100vw, (max-width: 1024px) 50vw, 384px"
          width="1200"
          height="675"
          [alt]="imatge.alt"
          [attr.loading]="i < 3 ? 'eager' : 'lazy'"
          class="h-auto w-full opacity-90 transition duration-300 hover:opacity-100">
        <figcaption class="p-3 text-center text-xs uppercase tracking-widest text-slate-400">{{ imatge.alt }}</figcaption>
      </figure>
    }
  </div>
</section>
